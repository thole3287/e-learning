version: '3.8'

services:
  # 1. Laravel Backend Application (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: elearning_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=elearning_db
      - DB_USERNAME=elearning_user
      - DB_PASSWORD=SecretPassword123!
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - db
      - cache
    networks:
      - elearning_net

  # 2. Nginx Web Server (Phục vụ Frontend & Proxy API)
  web:
    image: nginx:alpine
    container_name: elearning_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend/dist
      - ./backend:/var/www/backend
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - elearning_net

  # 3. MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: elearning_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elearning_db
      MYSQL_USER: elearning_user
      MYSQL_PASSWORD: SecretPassword123!
      MYSQL_ROOT_PASSWORD: RootPassword123!
    ports:
      - "3306:3306"
    volumes:
      - elearning_db_data:/var/lib/mysql
    networks:
      - elearning_net

  # 4. Redis Cache & Queue
  cache:
    image: redis:7-alpine
    container_name: elearning_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - elearning_redis_data:/data
    networks:
      - elearning_net

  # 5. Background Queue Worker & Auto-Submit Scheduler
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: elearning_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work --tries=3
    depends_on:
      - app
      - db
      - cache
    networks:
      - elearning_net

networks:
  elearning_net:
    driver: bridge

volumes:
  elearning_db_data:
  elearning_redis_data:
